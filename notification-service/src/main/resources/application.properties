spring.application.name=notification-service
server.port=8083

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=notifications
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

jwt.secret=${JWT_SECRET}

# Base64 of the Firebase service account JSON. Empty = log-only mode (no real pushes).
firebase.credentials=${FIREBASE_CREDENTIALS:}

# Quiet hours for reminders, in India time
notifications.zone=Asia/Kolkata

# Reminders (defaults: every 5 min, for 30 min, checked every 30 s; quiet 00:30-07:30)
notifications.reminder-every-seconds=${REMINDER_EVERY_SECONDS:300}
notifications.reminder-window-seconds=${REMINDER_WINDOW_SECONDS:1800}
notifications.reminder-tick-ms=${REMINDER_TICK_MS:30000}
notifications.quiet-start=${QUIET_START:00:30}
notifications.quiet-end=${QUIET_END:07:30}
