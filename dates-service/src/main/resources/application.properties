spring.application.name=dates-service
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dates
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

jwt.secret=${JWT_SECRET}

# Where notification-service runs (not a secret). Defaults to this PC.
notifications.url=${NOTIFICATIONS_URL:http://localhost:8083}
